<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>Assessment Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-8">

  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
    
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-slate-100 pb-4 gap-2">
      <div>
        <h1 class="text-xl font-bold text-slate-900 tracking-tight">Active Assessment Catalog</h1>
        <p class="text-xs text-slate-500">Select a topic from your assigned syllabus modules to begin.</p>
      </div>
      <div id="counter-badge" class="bg-blue-50 text-blue-700 font-semibold text-xs px-3 py-1 rounded-full w-max">
        Loading...
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200/60">
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Filter By Subject</label>
        <select id="subject-filter" onchange="applyFilters()" class="w-full text-xs px-3 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-blue-600 cursor-pointer">
          <option value="ALL">All Subjects</option>
        </select>
      </div>
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Filter By Chapter</label>
        <select id="chapter-filter" onchange="applyFilters()" class="w-full text-xs px-3 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-blue-600 cursor-pointer">
          <option value="ALL">All Chapters</option>
        </select>
      </div>
    </div>

    <div class="overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
      <table class="w-full text-left border-collapse bg-white">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-bold uppercase tracking-wider text-slate-600">
            <th class="px-4 py-3.5">Subject</th>
            <th class="px-4 py-3.5">Chapter / Topic</th>
            <th class="px-4 py-3.5 text-center">Level</th>
            <th class="px-4 py-3.5 text-center">Test Code</th> <th class="px-4 py-3.5 text-right">Action</th>
          </tr>
        </thead>
        <tbody id="catalog-list-table" class="divide-y divide-slate-100 text-sm font-medium text-slate-700">
          <tr>
            <td colspan="5" class="text-center py-10 text-xs text-slate-400 font-normal">
              Syncing active digital ledger catalog blocks...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // ⚠️ CRITICAL STEP: Paste your LIVE Google Web App URL inside these quotes!
   const WEB_APP_URL = "<?= ScriptApp.getService().getUrl() ?>";
    var masterCatalogData = [];

    window.onload = function() {
      google.script.run
        .withSuccessHandler(renderCatalogInterface)
        .withFailureHandler(function(err) {
          document.getElementById('catalog-list-table').innerHTML = 
            `<tr><td colspan="5" class="text-center py-10 text-xs text-rose-500 font-bold">Failed to load catalog: ${err.message}</td></tr>`;
        })
       .getActiveTestCatalog("<?= teacherSheetId ?>");
    };

    function renderCatalogInterface(catalog) {
      if (catalog.error) {
        document.getElementById('catalog-list-table').innerHTML = 
          `<tr><td colspan="5" class="text-center py-10 text-xs text-rose-500 font-bold">${catalog.error}</td></tr>`;
        return;
      }
      
      masterCatalogData = catalog;
      
      var subjects = new Set();
      var chapters = new Set();
      
      catalog.forEach(function(item) {
        if(item.subject) subjects.add(item.subject);
        if(item.chapter) chapters.add(item.chapter);
      });
      
      var subSelect = document.getElementById('subject-filter');
      subjects.forEach(function(sub) {
        subSelect.options[subSelect.options.length] = new Option(sub, sub);
      });
      
      var chapSelect = document.getElementById('chapter-filter');
      chapters.forEach(function(chap) {
        chapSelect.options[chapSelect.options.length] = new Option(chap, chap);
      });
      
      applyFilters();
    }

    function applyFilters() {
      var selectedSub = document.getElementById('subject-filter').value;
      var selectedChap = document.getElementById('chapter-filter').value;
      var tbody = document.getElementById('catalog-list-table');
      
      tbody.innerHTML = "";
      var visibleCount = 0;
      
      masterCatalogData.forEach(function(item) {
        var matchSub = (selectedSub === "ALL" || item.subject === selectedSub);
        var matchChap = (selectedChap === "ALL" || item.chapter === selectedChap);
        
        if (matchSub && matchChap) {
          visibleCount++;
          var row = document.createElement('tr');
          row.className = "hover:bg-slate-50/70 transition-colors";
          
          var lvlColor = "bg-slate-100 text-slate-600";
          if (item.level.toLowerCase() === "easy") lvlColor = "bg-emerald-50 text-emerald-700 border-emerald-200";
          else if (item.level.toLowerCase() === "medium") lvlColor = "bg-amber-50 text-amber-700 border-amber-200";
          else if (item.level.toLowerCase() === "tough") lvlColor = "bg-rose-50 text-rose-700 border-rose-200";
          
          var targetExamUrl = WEB_APP_URL + "?testId=" + item.testCode;
          
          // 🟢 Rendered Test Code as a clean, stand-alone column right before the action button
          row.innerHTML = `
            <td class="px-4 py-4 align-middle text-sm font-semibold text-slate-800 capitalize tracking-wide">${item.subject}</td>
            <td class="px-4 py-4 align-middle text-sm font-bold text-slate-900">${item.chapter}</td>
            <td class="px-4 py-4 align-middle text-center">
              <span class="text-[11px] font-bold uppercase tracking-wider border px-2 py-0.5 rounded-md ${lvlColor}">${item.level}</span>
            </td>
            <td class="px-4 py-4 align-middle text-center font-mono text-xs text-blue-600 font-semibold bg-slate-50/50 border-x border-slate-100">
              ${item.testCode}
            </td>
            <td class="px-4 py-4 align-middle text-right">
              <button onclick="window.open('${targetExamUrl}', '_blank')" class="inline-flex items-center text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow-sm transition cursor-pointer">
  Start Test →
</button>
            </td>
          `;
          tbody.appendChild(row);
        }
      });
      
      document.getElementById('counter-badge').innerText = visibleCount + " Active Test(s)";
      
      if (visibleCount === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-xs text-slate-400 font-normal bg-white">No active tests match your filters.</td></tr>`;
      }
    }
  </script>
</body>
</html>
