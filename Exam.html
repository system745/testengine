<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>Assessment Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-select { user-select: none; -webkit-user-select: none; }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; transform: translateY(15px); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12 no-select">

  <!-- HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 py-3 shadow-sm">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
      
      <!-- Title & Logo Area -->
      <div class="flex items-center gap-3">
        <img id="exam-logo" src="" class="hidden h-10 w-auto object-contain rounded">
        <div>
          <h1 id="exam-title" class="text-lg font-bold text-slate-900 leading-tight">Loading Assessment...</h1>
          <p id="exam-desc" class="text-xs text-slate-500"></p>
        </div>
      </div>

      <!-- Status Badges (Progress & Timer) -->
      <div class="flex items-center gap-2 self-end sm:self-auto">
        <!-- NEW: Progress Tracker -->
        <div id="progress-box" class="hidden bg-blue-50 border border-blue-200 text-blue-700 px-3 py-1.5 rounded-md font-semibold text-sm flex items-center gap-1.5 shadow-sm">
          📝 <span id="answered-count">0</span> / <span id="total-count">0</span>
        </div>
        <!-- Timer -->
        <div id="timer-box" class="hidden bg-amber-50 border border-amber-200 text-amber-700 px-3 py-1.5 rounded-md font-semibold text-sm flex items-center gap-1.5 shadow-sm">
          ⏳ <span id="time-left">00:00</span>
        </div>
      </div>

    </div>
  </header>

  <main id="app-wrapper" class="max-w-3xl mx-auto px-4 mt-6 z-10 relative">
    
    <!-- LOBBY CARD -->
    <div id="lobby-card" class="bg-white rounded-xl shadow-md border border-slate-200 p-6 max-w-md mx-auto mt-12">
      <h2 class="text-xl font-bold text-slate-900 text-center mb-1">Student Portal Login</h2>
      <p class="text-sm text-slate-500 text-center mb-6">Enter your credentials and the Exam Code to begin.</p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Student Full Name *</label>
          <input type="text" id="student-name" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:border-blue-600 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Mobile Number *</label>
          <input type="tel" id="student-phone" placeholder="10-digit number" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:border-blue-600 text-sm">
          <div class="mt-1.5 bg-amber-50 border border-amber-200 text-[11px] text-amber-800 rounded-md p-2 font-medium leading-normal tracking-wide shadow-sm">
            ⚠️ Please enter your correct WhatsApp number. A link will be generated at the end using this exact number to send you your scorecard.
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Exam Code *</label>
          <input type="text" id="test-id-input" placeholder="E.g. SG-12345" class="w-full px-3 py-2 border border-blue-200 bg-blue-50/50 rounded-md focus:outline-none focus:border-blue-600 font-mono text-sm uppercase">
        </div>
        
        <button type="button" id="lobby-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition text-sm shadow-sm mt-2">
          Unlock Assessment
        </button>
      </div>
    </div>

    <!-- EXAM CARD -->
    <div id="exam-card" class="hidden space-y-6">
      <div class="space-y-6">
        <div id="questions-container" class="space-y-6"></div>
        
        <div class="pt-4 border-t border-slate-200 flex justify-end">
          <button type="button" id="submit-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-8 py-3 rounded-md transition shadow-md text-sm">
            Finalize & Submit Test
          </button>
        </div>
      </div>
    </div>

  </main>

  <script>
    var globalSchema = null;
    var globalTestId = "";
    var examCountdown = null;
    var timeRemainingSeconds = 0;

    var currentName = "";
    var currentPhone = "";
    var currentTopic = "";

    // 1. LOBBY ENGINE
    function executeLobbySubmit() {
      var nameVal = document.getElementById('student-name').value.trim();
      var phoneVal = document.getElementById('student-phone').value.trim();
      var testId = document.getElementById('test-id-input').value.trim().toUpperCase();
      
      if (!nameVal || !phoneVal || !testId) {
        alert("⚠️ Please fill out your Full Name, Mobile Number, and Exam Code to proceed.");
        return;
      }
      
      var btn = document.getElementById('lobby-btn');
      btn.disabled = true;
      
      var lobbyOverlay = document.createElement('div');
      lobbyOverlay.id = "lobby-loading-screen";
      lobbyOverlay.className = "fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[9999] flex flex-col items-center justify-center text-white p-6 text-center animate-fade-in";
      lobbyOverlay.innerHTML = `
        <div class="bg-white text-slate-800 p-8 rounded-2xl shadow-2xl max-w-sm w-full space-y-6">
          <div class="relative w-20 h-20 mx-auto">
            <div class="absolute inset-0 border-4 border-slate-100 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center text-2xl">🔐</div>
          </div>
          <div class="space-y-2">
            <h3 class="text-lg font-extrabold text-slate-900 tracking-tight">Authenticating...</h3>
            <p class="text-xs text-slate-500 font-medium px-2 leading-relaxed">
              Verifying exam code and downloading the assessment blueprint. Please wait...
            </p>
          </div>
          <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
            <div class="bg-gradient-to-r from-blue-500 to-emerald-500 h-full w-full rounded-full animate-[pulse_1.5s_infinite]"></div>
          </div>
        </div>
      `;
      document.body.appendChild(lobbyOverlay);
      
      google.script.run
        .withSuccessHandler(function(rawPayload) {
          var overlay = document.getElementById('lobby-loading-screen');
          if (overlay) overlay.remove();

          if (!rawPayload) {
            alert("Error: Invalid or inactive Exam Code. Verify sequence.");
            btn.disabled = false;
            return;
          }
          
          let parsedData = (typeof rawPayload === "string") ? JSON.parse(rawPayload) : rawPayload;
          
          if (parsedData.error) {
            alert("Authentication Error: " + parsedData.error);
            btn.disabled = false;
            return;
          }

          globalSchema = parsedData;
          globalTestId = testId;
          
          currentName = nameVal;
          currentPhone = phoneVal;
          currentTopic = globalSchema.topic || "Assessment";
          
          startAssessmentMode();
        })
        .withFailureHandler(function(err) {
          var overlay = document.getElementById('lobby-loading-screen');
          if (overlay) overlay.remove();
          alert("Connection Timeout: " + err.message);
          btn.disabled = false;
        })
        .getActiveExamSchema(testId); 
    }

    // 2. LAYOUT & TIMER
    function startAssessmentMode() {
      document.getElementById('lobby-card').classList.add('hidden');
      
      // Set Title and Description
      document.getElementById('exam-title').innerText = globalSchema.fileName || "Active Workspace";
      document.getElementById('exam-desc').innerText = globalSchema.description || "";
      
      // Handle Optional Logo
      if (globalSchema.logo && globalSchema.logo.trim() !== "") {
        var logoEl = document.getElementById('exam-logo');
        logoEl.src = globalSchema.logo;
        logoEl.classList.remove('hidden');
      }
      
      // Build Questions
      buildQuestionsDOM(globalSchema.questions);
      
      // Setup Progress Tracker
      document.getElementById('total-count').innerText = globalSchema.questions.length;
      document.getElementById('progress-box').classList.remove('hidden');
      updateProgress(); // Initial check
      
      // Setup Timer
      timeRemainingSeconds = (globalSchema.durationMinutes || 45) * 60;
      document.getElementById('timer-box').classList.remove('hidden');
      refreshClockUI();
      
      examCountdown = setInterval(function() {
        timeRemainingSeconds--;
        refreshClockUI();
        if (timeRemainingSeconds <= 0) {
          clearInterval(examCountdown);
          alert("⏱️ Stop Work! The allocated block time has concluded. Auto-submitting responses...");
          executeExamSubmit();
        }
      }, 1000);
      
      document.getElementById('exam-card').classList.remove('hidden');
    }

    function refreshClockUI() {
      var mins = Math.floor(timeRemainingSeconds / 60);
      var secs = timeRemainingSeconds % 60;
      document.getElementById('time-left').innerText = 
        mins.toString().padStart(2, '0') + ":" + secs.toString().padStart(2, '0');
    }

    // NEW: PROGRESS TRACKER LOGIC
    function updateProgress() {
      if (!globalSchema || !globalSchema.questions) return;
      let answeredCount = 0;
      
      globalSchema.questions.forEach(function(q, idx) {
        if (q.type === 'MCQ' || q.type === 'Assertion-Reason') {
          if (document.querySelector('input[name="q-' + idx + '"]:checked')) {
            answeredCount++;
          }
        } else {
          let textVal = document.getElementById('text-ans-' + idx).value.trim();
          let fileVal = document.getElementById('base64-payload-' + idx).value;
          if (textVal !== "" || fileVal !== "") {
            answeredCount++;
          }
        }
      });
      
      document.getElementById('answered-count').innerText = answeredCount;
      
      // Visual feedback if all answered
      let progressBox = document.getElementById('progress-box');
      if (answeredCount === globalSchema.questions.length) {
        progressBox.classList.remove('bg-blue-50', 'border-blue-200', 'text-blue-700');
        progressBox.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
      } else {
        progressBox.classList.add('bg-blue-50', 'border-blue-200', 'text-blue-700');
        progressBox.classList.remove('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
      }
    }

    // 3. BUILD EXAM DOM
    function buildQuestionsDOM(questions) {
      var container = document.getElementById('questions-container');
      container.innerHTML = "";
      
      questions.forEach(function(q, idx) {
        var card = document.createElement('div');
        card.className = "bg-white p-6 rounded-xl border border-slate-200 shadow-sm relative space-y-4";
        
        var headRow = document.createElement('div');
        headRow.className = "flex justify-between items-center pb-1";
        headRow.innerHTML = '<span class="text-[11px] font-bold tracking-widest uppercase bg-slate-100 text-slate-600 px-2.5 py-1 rounded">'+ q.topic +'</span>' +
                             '<span class="text-xs font-semibold text-slate-400">[' + q.points + ' Mark(s)]</span>';
        card.appendChild(headRow);

        var label = document.createElement('p');
        label.className = "text-base font-bold text-slate-900 leading-relaxed";
        label.innerText = "Q" + (idx + 1) + ". " + q.text;
        card.appendChild(label);

        if (q.type === 'MCQ' || q.type === 'Assertion-Reason') {
          var optsGroup = document.createElement('div');
          optsGroup.className = "space-y-3 pt-2";
          
          var optionsArray = q.options ? q.options.split('|').map(function(o) { return o.trim(); }) : [];
          optionsArray.forEach(function(opt) {
            if (!opt) return;
            var optLabel = document.createElement('label');
            optLabel.className = "flex items-center gap-3 px-4 py-3 border border-slate-200 rounded-lg hover:bg-slate-50 cursor-pointer text-sm font-medium text-slate-700 transition tracking-wide";
            // Added onclick to update progress
            optLabel.innerHTML = '<input type="radio" name="q-' + idx + '" value="' + opt + '" onclick="updateProgress()" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500"> ' +
                                  '<span>' + opt + '</span>';
            optsGroup.appendChild(optLabel);
          });
          card.appendChild(optsGroup);
        } 
        else {
          var subjectiveBlock = document.createElement('div');
          subjectiveBlock.className = "space-y-4 pt-2";
          
          // Added oninput to update progress
          subjectiveBlock.innerHTML = 
            '<textarea id="text-ans-' + idx + '" oninput="updateProgress()" placeholder="Type summary response inputs here (Optional if photo is attached)..." rows="4" class="w-full text-sm px-4 py-3 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-600 bg-slate-50/30 leading-relaxed"></textarea>' +
            '<div class="border-2 border-dashed border-blue-200 rounded-xl p-4 bg-blue-50/20 flex flex-col sm:flex-row items-center justify-between gap-3">' +
              '<div>' +
                '<span class="text-sm font-bold text-blue-700 block mb-0.5">📸 Capture Handwritten Solution</span>' +
                '<span class="text-xs text-slate-400 block">Clicking triggers mobile camera natively.</span>' +
              '</div>' +
              '<input type="file" id="file-' + idx + '" accept="image/*" capture="environment" class="text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 file:cursor-pointer shadow-sm">' +
            '</div>' +
            '<input type="hidden" id="base64-payload-' + idx + '" value="">' +
            '<input type="hidden" id="filename-payload-' + idx + '" value="">' +
            '<div id="thumb-preview-box-' + idx + '" class="hidden flex items-center gap-3 bg-slate-100 p-2 rounded border border-slate-200 max-w-xs">' +
              '<img id="img-thumb-' + idx + '" src="" class="w-12 h-12 object-cover rounded shadow-sm border border-slate-300">' +
              '<div class="flex-1 min-w-0"><p id="label-name-' + idx + '" class="text-[11px] font-mono text-slate-600 truncate"></p></div>' +
              '<button type="button" id="del-btn-' + idx + '" class="text-xs font-semibold bg-rose-500 hover:bg-rose-600 text-white px-2 py-1 rounded">Delete</button>' +
            '</div>';
            
          card.appendChild(subjectiveBlock);
          
          setTimeout(function() {
            var fileEl = document.getElementById('file-' + idx);
            if (fileEl) {
              fileEl.onchange = function(ev) { handleLocalFileProcess(ev.target, idx); };
            }
            var delEl = document.getElementById('del-btn-' + idx);
            if (delEl) {
              delEl.onclick = function() { clearAttachedFile(idx); };
            }
          }, 5);
        }
        
        container.appendChild(card);

        if (idx < questions.length - 1) {
          var divider = document.createElement('hr');
          divider.className = "my-6 border-t border-slate-200/60 w-11/12 mx-auto";
          container.appendChild(divider);
        }
      });
    }

    function handleLocalFileProcess(inputElement, questionIndex) {
      var file = inputElement.files[0];
      if (!file) return;

      if (file.size > 8 * 1024 * 1024) {
        alert("File Limit Warning: Image is larger than 8MB.");
        inputElement.value = "";
        return;
      }

      var reader = new FileReader();
      reader.onload = function(e) {
        var fullRawDataUrl = e.target.result;
        var base64CleanString = fullRawDataUrl.split(',')[1];
        
        document.getElementById('base64-payload-' + questionIndex).value = base64CleanString;
        document.getElementById('filename-payload-' + questionIndex).value = file.name;
        
        document.getElementById('img-thumb-' + questionIndex).src = fullRawDataUrl;
        document.getElementById('label-name-' + questionIndex).innerText = file.name;
        document.getElementById('thumb-preview-box-' + questionIndex).classList.remove('hidden');
        
        updateProgress(); // Update progress when file is attached
      };
      reader.readAsDataURL(file);
    }

    function clearAttachedFile(questionIndex) {
      var fileInput = document.getElementById('file-' + questionIndex);
      if (fileInput) fileInput.value = "";
      document.getElementById('base64-payload-' + questionIndex).value = "";
      document.getElementById('filename-payload-' + questionIndex).value = "";
      document.getElementById('thumb-preview-box-' + questionIndex).classList.add('hidden');
      
      updateProgress(); // Update progress when file is removed
    }

    // 4. SUBMIT ENGINE
    function executeExamSubmit() {
      clearInterval(examCountdown);
      
      var submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      
      var submitOverlay = document.createElement('div');
      submitOverlay.id = "exam-loading-screen";
      submitOverlay.className = "fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[9999] flex flex-col items-center justify-center text-white p-6 text-center animate-fade-in";
      submitOverlay.innerHTML = `
        <div class="bg-white text-slate-800 p-8 rounded-2xl shadow-2xl max-w-sm w-full space-y-6">
          <div class="relative w-20 h-20 mx-auto">
            <div class="absolute inset-0 border-4 border-slate-100 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center text-2xl">📝</div>
          </div>
          <div class="space-y-2">
            <h3 class="text-lg font-extrabold text-slate-900 tracking-tight">Submitting Assessment</h3>
            <p class="text-xs text-slate-500 font-medium px-2 leading-relaxed">
              Securing answers and uploading solution papers to the cloud dashboard. Please do not close this window...
            </p>
          </div>
          <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
            <div class="bg-gradient-to-r from-blue-500 to-emerald-500 h-full w-full rounded-full animate-[pulse_1.5s_infinite]"></div>
          </div>
        </div>
      `;
      document.body.appendChild(submitOverlay);
      
      var collectedAnswers = [];
      globalSchema.questions.forEach(function(q, idx) {
        if (q.type === 'MCQ' || q.type === 'Assertion-Reason') {
          var selected = document.querySelector('input[name="q-' + idx + '"]:checked');
          collectedAnswers.push(selected ? selected.value : "[No Response]");
        } else {
          var rawTxt = document.getElementById('text-ans-' + idx).value.trim();
          var b64Data = document.getElementById('base64-payload-' + idx).value;
          var fileName = document.getElementById('filename-payload-' + idx).value;
          
          if (b64Data) {
            collectedAnswers.push({ textNotes: rawTxt || "[Supplements Attached]", mimeType: "image/jpeg", base64: b64Data, filename: fileName });
          } else {
            collectedAnswers.push(rawTxt || "[No Response]");
          }
        }
      });

      var submissionPayload = {
        testId: globalTestId,
        examName: globalSchema.fileName,
        teacherSheetId: globalSchema.teacherSheetId, 
        name: currentName,
        phone: currentPhone,
        answers: collectedAnswers
      };

      google.script.run
        .withSuccessHandler(function(status) {
          var overlay = document.getElementById('exam-loading-screen');
          if (overlay) overlay.remove();
          
          document.getElementById('exam-card').classList.add('hidden');
          document.getElementById('timer-box').classList.add('hidden');
          document.getElementById('progress-box').classList.add('hidden');
          
          const teacherContactNumber = "919599952599"; 
          const humanTextMessage = "Hello Sir, I have just completed the test for " + currentTopic + ". Please share my report card when you are free! Thanks.";
          const secureUriMessage = encodeURIComponent(humanTextMessage);
          const dispatchWhatsAppUrl = "https://wa.me/" + teacherContactNumber + "?text=" + secureUriMessage;

          const completeSuccessTemplate = `
            <div class="max-w-md mx-auto text-center py-12 px-6 bg-white rounded-xl shadow-md border border-slate-200 mt-12 fade-in-up">
              <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-6 shadow-inner font-bold">✓</div>
              <h2 class="text-2xl font-extrabold text-slate-900 mb-2">Test Submitted!</h2>
              <p class="text-sm text-slate-500 mb-8 font-medium">Your answers have been securely logged in the system.</p>
              
              <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 text-left shadow-inner">
                <h3 class="text-sm font-bold text-slate-700 mb-1.5">Get Your Scorecard</h3>
                <p class="text-xs text-slate-500 mb-4 leading-relaxed">
                  Click below to send me a quick WhatsApp message, and I will share your scorecard with you right away.
                </p>
                <a href="${dispatchWhatsAppUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 bg-[#25D366] hover:bg-[#1DA851] text-white font-bold py-3.5 px-4 rounded-xl shadow transition transform hover:-translate-y-0.5 text-sm">
                  <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                  Click here to get Report on WhatsApp
                </a>
              </div>
            </div>
          `;
          
          document.getElementById('app-wrapper').innerHTML = completeSuccessTemplate;
          window.scrollTo(0, 0);
        })
        .withFailureHandler(function(err) {
          var overlay = document.getElementById('exam-loading-screen');
          if (overlay) overlay.remove();
          alert("Submission Error: " + err.message);
          submitBtn.disabled = false;
        })
        .processCustomExamSubmission(submissionPayload);
    }

    document.getElementById('lobby-btn').onclick = executeLobbySubmit;
    document.getElementById('submit-btn').onclick = executeExamSubmit;

    try {
      var urlParams = new URLSearchParams(window.location.search);
      var queryTestId = urlParams.get('testId');
      if (queryTestId) {
        document.getElementById('test-id-input').value = queryTestId.toUpperCase();
      }
    } catch (e) {}
  </script>
</body>
</html>
